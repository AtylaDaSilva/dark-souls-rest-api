[project]
name = "dark-souls-rest-api"
version = "0.1.0"
description = "A portfolio project of a simple REST API for Dark Souls items, weapons, ect."
authors = [
    {name = "Atyla da Silva",email = "atylamendes97@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "flask-sqlalchemy (>=3.1.1,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
